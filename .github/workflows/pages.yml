name: Publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir _site
          cp index.html Macro_Dashboard.xlsx _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # If the deploy step fails (for example GitHub cannot find the page artifact),
  # start one fresh run after a short wait. Only a push run retries, and the retry
  # is a manual-dispatch run, so a second failure never starts a third.
  retry:
    needs: deploy
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Wait, then start one fresh run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
